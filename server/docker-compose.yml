services:
  postgres:
    image: postgis/postgis:17-3.5
    environment:
      POSTGRES_USER: worldintel
      POSTGRES_PASSWORD: worldintel
      POSTGRES_DB: worldintel
    ports:
      - "5432:5432"
    volumes:
      - worldintel_pg:/var/lib/postgresql/data
      - ../db/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U worldintel -d worldintel"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - worldintel_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  worldintel_pg:
  worldintel_redis:
